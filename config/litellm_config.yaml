  # ──────────────────────────────────────────────────────────────
  # PROJECT ALIASES (used by agents in PLAN.md)
  # Map logical roles to specific models for easy swapping
  # ──────────────────────────────────────────────────────────────

  # Primary reasoning model for the decision synthesizer
  - model_name: "agent-reasoning"
    litellm_params:
      model: "openai/gpt-5.2-2025-12-11"
      api_key: "os.environ/OPENAI_API_KEY"

  # Fast model for individual agent tasks
  - model_name: "agent-fast"
    litellm_params:
      model: "openai/gpt-5-mini-2025-08-07"
      api_key: "os.environ/OPENAI_API_KEY"

  # Cheapest model for bulk operations (sentiment scoring, data processing)
  - model_name: "agent-bulk"
    litellm_params:
      model: "openai/gpt-5-nano-2025-08-07"
      api_key: "os.environ/OPENAI_API_KEY"

  # Embedding model for RAG vector store
  - model_name: "embedder"
    litellm_params:
      model: "openai/text-embedding-3-small"
      api_key: "os.environ/OPENAI_API_KEY"

litellm_settings:
  drop_params: true
  set_verbose: false
  num_retries: 3
  request_timeout: 120
  cache: true
  cache_params:
    type: "local"
    ttl: 3600

general_settings:
  master_key: "sk-ds288r"
  database_url: null
